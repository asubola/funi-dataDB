[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funi-dataDB"
version = "0.1.0"
description = "Librería personal para conexiones transversales a bases de datos (MySQL/PostgreSQL/Vertica) con credenciales en Windows Credential Manager."
readme = "CLAUDE.md"
requires-python = ">=3.11"
authors = [{ name = "Edu Anzuola", email = "eanzuola@funidelia.es" }]
license = { text = "Proprietary" }
dependencies = [
    "keyring>=24.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
vertica = ["sqlalchemy-vertica-python>=0.6"]
all = ["funi-dataDB[mysql,postgres,vertica]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
funi-data = "funi_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["funi_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a real database connection",
]
